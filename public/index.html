<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QrexApi</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#0b0b12;color:#e8e8f0}
  .side{background:#12121c;border-right:1px solid #1f1f2e}
  .card{background:#141422;border:1px solid #222235}
  .nav-item{color:#9a9ab0}
  .nav-item:hover,.nav-item.active{background:#1c1c2e;color:#c4b5fd}
  textarea,input{background:#0e0e18;border:1px solid #2a2a3d;color:#e8e8f0}
  input:focus,textarea:focus{outline:none;border-color:#7c3aed}
</style>
</head>
<body class="min-h-screen">
<div id="loginView" class="min-h-screen flex items-center justify-center p-6">
  <div class="card rounded-2xl p-10 w-full max-w-md">
    <div class="text-3xl font-bold mb-2 text-center">QrexApi</div>
    <p class="text-sm text-zinc-400 mb-8 text-center">Scripts · Ofuscación · Dashboard</p>

    <div class="flex gap-2 mb-6">
      <button id="tabLogin" onclick="setTab('login')" class="flex-1 py-2 rounded-lg text-sm font-medium bg-violet-600">Entrar</button>
      <button id="tabReg" onclick="setTab('register')" class="flex-1 py-2 rounded-lg text-sm font-medium bg-zinc-800 text-zinc-400">Registrarse</button>
    </div>

    <div class="space-y-4">
      <input id="authUser" type="text" placeholder="Usuario" autocomplete="username"
        class="w-full rounded-xl px-4 py-3 text-sm"/>
      <input id="authPass" type="password" placeholder="Contraseña" autocomplete="current-password"
        class="w-full rounded-xl px-4 py-3 text-sm"/>
      <button id="authBtn" onclick="doAuth()" class="w-full bg-violet-600 hover:bg-violet-500 py-3 rounded-xl font-semibold">
        Entrar
      </button>
      <p id="loginErr" class="text-red-400 text-sm text-center hidden"></p>
    </div>
  </div>
</div>

<div id="appView" class="hidden min-h-screen flex">
  <aside class="side w-64 p-5 flex flex-col fixed h-full">
    <div class="font-bold text-lg mb-8 px-2">⚡ QrexApi</div>
    <nav class="flex flex-col gap-1 flex-1 text-sm">
      <button class="nav-item active text-left px-3 py-2.5 rounded-lg" data-page="overview" onclick="go('overview')">Overview</button>
      <button class="nav-item text-left px-3 py-2.5 rounded-lg" data-page="scripts" onclick="go('scripts')">Lua Scripts</button>
      <button class="nav-item text-left px-3 py-2.5 rounded-lg" data-page="create" onclick="go('create')">Create Script</button>
      <button class="nav-item text-left px-3 py-2.5 rounded-lg" data-page="executions" onclick="go('executions')">Executions</button>
    </nav>
    <div class="text-xs text-zinc-500 px-2 mb-2" id="userLabel"></div>
    <button onclick="logout()" class="text-left text-red-400 text-sm px-3 py-2">Cerrar sesión</button>
  </aside>

  <main class="ml-64 flex-1 p-8">
    <section id="page-overview" class="page">
      <h1 class="text-2xl font-bold mb-6">Overview</h1>
      <div class="grid grid-cols-2 gap-4 max-w-xl">
        <div class="card rounded-xl p-5"><div class="text-zinc-400 text-sm">Scripts</div><div id="stScripts" class="text-3xl font-bold">0</div></div>
        <div class="card rounded-xl p-5"><div class="text-zinc-400 text-sm">Ejecuciones</div><div id="stExec" class="text-3xl font-bold text-violet-400">0</div></div>
      </div>
    </section>

    <section id="page-scripts" class="page hidden">
      <div class="flex justify-between mb-6">
        <h1 class="text-2xl font-bold">Lua Scripts</h1>
        <button onclick="go('create')" class="bg-violet-600 hover:bg-violet-500 px-4 py-2 rounded-lg text-sm">+ Create</button>
      </div>
      <div id="scriptsList" class="grid gap-4"></div>
    </section>

    <section id="page-create" class="page hidden">
      <h1 class="text-2xl font-bold mb-6">Create Script</h1>
      <div class="card rounded-2xl p-6 max-w-3xl space-y-4">
        <input id="sName" placeholder="Name *" class="w-full rounded-xl px-4 py-3 outline-none"/>
        <input id="sDesc" placeholder="Description" class="w-full rounded-xl px-4 py-3 outline-none"/>
        <div class="text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 rounded-xl px-4 py-3">
          Source sin ofuscar. Se ofusca con QyrexObf antes de llegar a los usuarios.
        </div>
        <textarea id="sSource" placeholder="Pega tu Lua aquí..." class="w-full h-64 rounded-xl px-4 py-3 font-mono text-sm outline-none resize-none"></textarea>
        <button id="createBtn" onclick="createScript()" class="bg-violet-600 hover:bg-violet-500 px-5 py-3 rounded-xl font-semibold">Create</button>
        <textarea id="createOut" readonly class="w-full h-20 rounded-xl px-4 py-3 font-mono text-xs text-emerald-400 resize-none"></textarea>
      </div>
    </section>

    <section id="page-executions" class="page hidden">
      <h1 class="text-2xl font-bold mb-6">Executions</h1>
      <div class="card rounded-xl overflow-hidden">
        <table class="w-full text-sm">
          <thead class="text-zinc-500 text-left"><tr><th class="px-4 py-3">Fecha</th><th class="px-4 py-3">Script</th><th class="px-4 py-3">IP</th></tr></thead>
          <tbody id="execTable"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
let token = localStorage.getItem('qrex_token') || '';
let mode = 'login';

function headers(){
  return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
}

function setTab(m){
  mode = m;
  const btn = document.getElementById('authBtn');
  const tLogin = document.getElementById('tabLogin');
  const tReg = document.getElementById('tabReg');
  if (m === 'login') {
    btn.textContent = 'Entrar';
    tLogin.className = 'flex-1 py-2 rounded-lg text-sm font-medium bg-violet-600';
    tReg.className = 'flex-1 py-2 rounded-lg text-sm font-medium bg-zinc-800 text-zinc-400';
  } else {
    btn.textContent = 'Crear cuenta';
    tReg.className = 'flex-1 py-2 rounded-lg text-sm font-medium bg-violet-600';
    tLogin.className = 'flex-1 py-2 rounded-lg text-sm font-medium bg-zinc-800 text-zinc-400';
  }
  document.getElementById('loginErr').classList.add('hidden');
}

function showApp(user){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userLabel').textContent = '@' + (user?.username || '');
  loadStats();
  loadScripts();
}

function logout(){
  token = '';
  localStorage.removeItem('qrex_token');
  location.reload();
}

function setErr(msg){
  const el = document.getElementById('loginErr');
  el.classList.remove('hidden');
  el.textContent = msg || 'Error';
}

async function doAuth(){
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const btn = document.getElementById('authBtn');
  if (!username || !password) {
    setErr('Pon usuario y contraseña');
    return;
  }
  btn.disabled = true;
  btn.textContent = '...';
  document.getElementById('loginErr').classList.add('hidden');
  try {
    const url = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const text = await r.text();
    let d;
    try { d = JSON.parse(text); }
    catch {
      console.error('No JSON:', text.slice(0, 200));
      throw new Error('API no responde JSON. Revisa vercel.json y redeploy.');
    }
    if (!r.ok) throw new Error(d.error || 'Error');
    token = d.token;
    localStorage.setItem('qrex_token', token);
    showApp(d.user);
  } catch (e) {
    setErr(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = mode === 'login' ? 'Entrar' : 'Crear cuenta';
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !document.getElementById('loginView').classList.contains('hidden')) {
    doAuth();
  }
});

window.onload = function(){
  if (token) {
    fetch('/api/me', { headers: headers() })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(showApp)
      .catch(logout);
  }
};

function go(p){
  document.querySelectorAll('.page').forEach(x => x.classList.add('hidden'));
  document.getElementById('page-' + p).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector('[data-page="' + p + '"]');
  if (btn) btn.classList.add('active');
  if (p === 'scripts') loadScripts();
  if (p === 'overview') loadStats();
  if (p === 'executions') loadExec();
}

function esc(t){
  const d = document.createElement('div');
  d.textContent = t || '';
  return d.innerHTML;
}

async function loadStats(){
  const r = await fetch('/api/stats', { headers: headers() });
  if (!r.ok) return;
  const d = await r.json();
  document.getElementById('stScripts').textContent = d.scripts || 0;
  document.getElementById('stExec').textContent = d.executions || 0;
}

async function loadScripts(){
  const r = await fetch('/api/scripts', { headers: headers() });
  if (!r.ok) return;
  const list = await r.json();
  const host = location.origin;
  document.getElementById('scriptsList').innerHTML = list.map(s => {
    const ls = 'loadstring(game:HttpGet("' + host + '/api/raw/' + s.id + '"))()';
    return '<div class="card rounded-xl p-5">' +
      '<div class="flex justify-between mb-2"><div><div class="font-semibold text-violet-300">' + esc(s.name) + '</div>' +
      '<div class="text-xs text-zinc-500">' + esc(s.description || '') + '</div></div>' +
      '<div class="text-xs text-zinc-400">Ejecuciones: ' + (s.executions || 0) + '</div></div>' +
      '<div class="mt-3 flex gap-2">' +
      '<button onclick="navigator.clipboard.writeText(\'' + ls.replace(/'/g, "\\'") + '\')" class="text-xs bg-violet-700/50 hover:bg-violet-600 px-3 py-1.5 rounded-lg">Copiar loadstring</button>' +
      '<button onclick="delScript(\'' + s.id + '\')" class="text-xs text-red-400 hover:text-red-300 px-3 py-1.5">Eliminar</button>' +
      '</div>' +
      '<pre class="mt-3 text-[10px] text-zinc-500 overflow-x-auto whitespace-pre-wrap break-all">' + esc(ls) + '</pre>' +
      '</div>';
  }).join('') || '<p class="text-zinc-500">No hay scripts todavía.</p>';
}

async function createScript(){
  const name = document.getElementById('sName').value.trim();
  const description = document.getElementById('sDesc').value.trim();
  const source = document.getElementById('sSource').value;
  const btn = document.getElementById('createBtn');
  const out = document.getElementById('createOut');
  if (!name || !source) { out.value = 'Name y source son obligatorios'; return; }
  btn.disabled = true;
  btn.textContent = 'Creando...';
  out.value = '';
  try {
    const r = await fetch('/api/scripts', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ name, description, source })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    out.value = d.loadstring || JSON.stringify(d);
    document.getElementById('sName').value = '';
    document.getElementById('sDesc').value = '';
    document.getElementById('sSource').value = '';
    loadScripts();
    loadStats();
  } catch (e) {
    out.value = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create';
  }
}

async function delScript(id){
  if (!confirm('¿Eliminar este script?')) return;
  await fetch('/api/scripts/' + id, { method: 'DELETE', headers: headers() });
  loadScripts();
  loadStats();
}

async function loadExec(){
  const r = await fetch('/api/executions', { headers: headers() });
  if (!r.ok) return;
  const list = await r.json();
  document.getElementById('execTable').innerHTML = list.map(e => {
    const d = e.createdAt ? new Date(e.createdAt).toLocaleString() : '-';
    return '<tr class="border-t border-zinc-800"><td class="px-4 py-2">' + esc(d) + '</td><td class="px-4 py-2">' + esc(e.scriptName) + '</td><td class="px-4 py-2 text-zinc-400">' + esc(e.ip) + '</td></tr>';
  }).join('') || '<tr><td colspan="3" class="px-4 py-6 text-zinc-500 text-center">Sin ejecuciones</td></tr>';
}
</script>
</body>
</html>
