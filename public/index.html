<!-- Dentro de tu script de handleCredentialResponse -->
<script>
    function handleCredentialResponse(response) {
        // CAMBIA ESTA URL POR LA DE TU SERVIDOR/VERCEL
        fetch('https://tu-api-backend.vercel.app/api/auth', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: response.credential })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                console.log("Logueado:", data.user);
            }
        });
    }
</script>
