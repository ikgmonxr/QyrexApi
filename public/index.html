<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qyrex - Autenticación</title>
    <!-- Script oficial de Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        #mensaje {
            margin-top: 20px;
            font-size: 14px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Iniciar sesión en Qyrex</h2>
        <p>Inicia sesión con tu cuenta de Google para continuar</p>
        
        <!-- Contenedor del botón de Google -->
        <div id="g_id_onload"
             data-client_id="294416776289-bc3olhe9qhh1n1l0j2klrvus8a4amb2v.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="sign_in_with"
             data-size="large"
             data-logo_alignment="left">
        </div>

        <div id="mensaje"></div>
    </div>

    <script>
        function handleCredentialResponse(response) {
            const token = response.credential;
            document.getElementById('mensaje').innerText = "Validando token con el servidor...";

            // Aquí se conectará con tu endpoint en Vercel (/api/auth)
            fetch('/api/auth', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token: token })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('mensaje').style.color = "#4ade80";
                    document.getElementById('mensaje').innerText = "¡Bienvenido, " + data.user.name + "!";
                    // Aquí puedes redirigir al usuario o guardar su sesión
                } else {
                    document.getElementById('mensaje').style.color = "#f87171";
                    document.getElementById('mensaje').innerText = "Error de autenticación: " + (data.message || "Desconocido");
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('mensaje').style.color = "#f87171";
                document.getElementById('mensaje').innerText = "Error de conexión con el servidor.";
            });
        }
    </script>
</body>
</html>
